schema_version: 1

gpio:
  k1: 17
  k2: 27
  k3: 22

timing:
  cooldown_s: 10
  cooldown_retry_s: 60
  boot_timeout_s: 90
  scope_arm_timeout_s: 2.0
  scope_acquisition_timeout_s: 5
  k3_backstop_s: 0.300
  pass_limit_s: 0.02497
  no_trip_limit_s: 0.100
  heartbeat_grace_s: 300
  mains_stagger_ms: 0

modes:
  scope_mode: sim
  camera_mode: sim

paths:
  run_root: ./runs
  output_root: ./runs

monitoring:
  heartbeat_url_env: CCID_HEALTHCHECKS_URL


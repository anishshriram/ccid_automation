schema_version: 1

gpio:
  k1: 17
  k2: 27
  k3: 22

vision:
  roi_x: 35
  roi_y: 120
  roi_width: 450
  roi_height: 350
  # Charging-gate grant policy (ccid.classify.ChargingGatePolicy): grant once
  # this many confidently-green frames are seen within this rolling window.
  # Starting values, not locked - validate against real C270 frame rate and
  # actual EVSE flash cadence.
  charging_green_window_s: 6.0
  charging_green_required_frames: 3
  charging_green_min_span_s: 3.5

camera:
  # A raw numeric /dev/videoN index is NOT stable across USB reconnects -
  # the camera has re-enumerated from video0 to video1/video2 on this rig
  # before, leaving a hardcoded index pointing at nothing and producing
  # immediate camera-unavailable degradation. device_index accepts either
  # an int index or a device path string (cv2.VideoCapture() takes both).
  #
  # DEPLOYMENT ORDER MATTERS: this value assumes deploy/99-c270-camera.rules
  # is already installed on the Pi and /dev/ccid_camera exists (ls -la
  # /dev/ccid_camera to confirm) - see that file's own header for the
  # install steps. Deploying this config change before the udev rule is
  # installed will fail to open the camera at all, which is worse than the
  # numeric-index problem this is fixing. If the udev rule isn't installed
  # yet, use a plain int (e.g. 0) instead until it is.
  device_index: /dev/ccid_camera

timing:
  cooldown_s: 10
  cooldown_retry_s: 60
  boot_timeout_s: 90
  scope_arm_timeout_s: 2.0
  scope_acquisition_timeout_s: 5
  k3_backstop_s: 0.300
  pass_limit_s: 0.02497
  no_trip_limit_s: 0.100
  heartbeat_grace_s: 300
  mains_stagger_ms: 0
  # Every 50th cycle, disconnect/reconnect the scope and stop/start the
  # camera before mains close for that cycle - cheap periodic recovery for
  # gradual USB/reader-thread degradation over a multi-day campaign. 0
  # disables it.
  equipment_refresh_interval_cycles: 50
  # Reactive trigger, independent of the schedule above: refresh
  # immediately after this many consecutive camera-unavailable cycles,
  # rather than waiting for the next scheduled interval. Matches the real
  # incident this was added for (3 consecutive cycles). 0 disables it.
  equipment_refresh_after_consecutive_camera_unavailable: 3

modes:
  gpio_mode: real
  scope_mode: real
  camera_mode: real

paths:
  run_root: ./runs
  output_root: ./runs
  # Fault-matrix row: halt (persistence fault) rather than risk a partial
  # artifact write if free space on the run/output filesystem drops below this.
  min_free_disk_gb: 2

monitoring:
  cronitor_url_env: CCID_CRONITOR_URL

# Trip-time analysis. The algorithm is deferred (handoff section 4), but the
# measurement endpoints are not: UL 2231-2 section 23.3.1 is the authority, and
# until its endpoint definition is confirmed on paper the definition below is
# the one this campaign uses. Frozen by the config hash; change it only by
# introducing a new analysis algorithm_version.
analysis:
  algorithm_version: v3
  endpoint_definition: >-
    v3 endpoints: as v2, except detected-onset refinement below on_threshold
    must also be confirmed against the raw samples themselves (a short
    sustained run above the residual floor), not the forward-looking leading
    envelope alone. Fixes a v2 defect: a single noisy or quantization-limited
    sample crossing the residual floor could drag the refined onset back to an
    unrelated point in the pre-trigger record, because the leading envelope
    cannot distinguish an isolated sample from genuine sustained conduction
    within one envelope window. v1 and v2 results already recorded under
    those versions remain exactly as computed and are not retroactively
    corrected; replay under v3 to get the corrected number for a given
    waveform.
    trip_time_s = t_end - t0.
  line_frequency_hz: 60.0
  envelope_window_cycles: 0.5
  envelope_on_fraction: 0.25
  envelope_off_fraction: 0.10
  noise_floor_v: 0.5
  collapse_persistence_cycles: 1.0
  signal_present_rms_v: 1.0
  pretrigger_leakage_rms_v: 1.0
  burst_start_tolerance_s: 0.020
  pretrigger_leakage_guard_cycles: 1.0
  residual_floor_noise_multiple: 5.0
  noise_collapse_multiple: 6.0
  endpoint_uncertainty_s: 0.0005
